<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学小勇士 - 闯关游戏</title>
    <style>
        :root {
            --bg: #f0fdf4;
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --text: #1f2937;
            --card-bg: #ffffff;
            --error: #ef4444;
            --orange: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .header-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            gap: 10px;
        }

        .back-btn {
            background: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .back-btn:hover { background: #f3f4f6; }
        .back-btn:active { transform: scale(0.95); }

        .timer-box, .score-box {
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer-box { color: #0284c7; }
        .score-box { color: var(--orange); }

        .main-container {
            width: 90%;
            max-width: 550px;
            background: var(--card-bg);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            margin-top: 10px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-area {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* 输入框：增加状态改变 */
        .answer-box {
            display: inline-block;
            min-width: 100px;
            height: 80px;
            line-height: 80px;
            border-bottom: 5px solid var(--primary);
            color: var(--primary-dark);
            background: #f0fdf4;
            border-radius: 10px;
            font-size: 3.5rem;
            transition: all 0.3s;
        }

        /* 等待倒计时时的橘色状态 */
        .answer-box.waiting {
            border-bottom-color: var(--orange);
            background: #fffbeb;
        }

        /* 倒计时小提示 */
        .auto-hint {
            height: 24px;
            font-size: 1rem;
            color: var(--orange);
            margin-bottom: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            font-weight: bold;
        }
        .auto-hint.show { opacity: 1; }

        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 450px;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .num-btn {
            background: white;
            border: 3px solid #e5e7eb;
            border-radius: 15px;
            font-size: 2rem;
            font-weight: bold;
            color: var(--text);
            padding: 15px 0;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 5px 0 #e5e7eb;
            font-family: inherit;
        }

        .num-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #e5e7eb;
        }
        
        .num-btn:hover { background: #f9fafb; border-color: #d1d5db; }

        .control-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 450px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .ctrl-btn {
            flex: 1;
            border: none;
            border-radius: 15px;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            padding: 15px 0;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .backspace-btn {
            background: #9ca3af;
            box-shadow: 0 5px 0 #6b7280;
        }
        .backspace-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #6b7280;
        }

        .confirm-btn {
            background: var(--primary);
            box-shadow: 0 5px 0 var(--primary-dark);
            flex: 2;
        }
        .confirm-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 var(--primary-dark);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        .overlay.hidden { display: none; }

        .overlay h2 {
            font-size: 2.2rem;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            margin-top: 20px;
        }

        .menu-btn {
            background: white;
            border: 3px solid #e5e7eb;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text);
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .menu-btn:hover { background: #f0fdf4; border-color: var(--primary); }

        .correct-anim { animation: pop 0.3s ease; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: var(--primary); }
            100% { transform: scale(1); }
        }

        .wrong-anim {
            animation: shake 0.4s ease;
            color: var(--error) !important;
            border-bottom-color: var(--error) !important;
            background: #fef2f2 !important;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            animation: fall 2s linear forwards;
            z-index: 20;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(500px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="back-btn" onclick="backToMenu()" title="返回选择难度">🏠 返回</button>
        <div class="timer-box">⏱️ <span id="timeDisplay">00:00</span></div>
        <div class="score-box">⭐ <span id="scoreDisplay">0/10</span></div>
    </div>

    <div class="main-container" id="gameContainer">
        <div class="question-area">
            <span id="num1">0</span>
            <span id="operator">+</span>
            <span id="num2">0</span>
            <span>=</span>
            <span class="answer-box" id="answerDisplay"></span>
        </div>
        
        <!-- 倒计时提示 -->
        <div class="auto-hint" id="autoHint">输入完成，马上自动提交...</div>

        <div class="input-area">
            <div class="buttons-grid" id="buttonsGrid"></div>
            
            <div class="control-buttons">
                <button class="ctrl-btn backspace-btn" onclick="backspace()">⌫ 退格</button>
                <button class="ctrl-btn confirm-btn" onclick="submitAnswer()">✔ 确认</button>
            </div>
        </div>

        <div class="overlay" id="overlay">
            <div id="menuView">
                <h2>🎯 选择挑战难度</h2>
                <p>请选择一个关卡开始闯关</p>
                <div class="menu-options">
                    <button class="menu-btn" onclick="startGame('add10')">1️⃣ 10以内加减法</button>
                    <button class="menu-btn" onclick="startGame('add20')">2️⃣ 20以内加减法</button>
                    <button class="menu-btn" onclick="startGame('mul')">3️⃣ 九九乘法表</button>
                </div>
            </div>
            
            <div id="resultView" style="display: none;">
                <h2>🎉 恭喜你，闯关成功！</h2>
                <p id="resultText">你太棒啦！</p>
                <button class="action-btn menu-btn" onclick="backToMenu()">返回菜单</button>
            </div>
        </div>
    </div>

    <script>
        let totalQuestions = 10;
        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval;
        let secondsElapsed = 0;
        let currentAnswer = 0;
        let isPlaying = false;
        let currentMode = ''; 
        
        let userInput = ""; 
        let autoSubmitTimer = null; // 用于控制 3 秒自动提交

        const timeDisplay = document.getElementById('timeDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const num1El = document.getElementById('num1');
        const num2El = document.getElementById('num2');
        const operatorEl = document.getElementById('operator');
        const answerDisplay = document.getElementById('answerDisplay');
        const autoHint = document.getElementById('autoHint');
        const buttonsGrid = document.getElementById('buttonsGrid');
        const overlay = document.getElementById('overlay');
        const menuView = document.getElementById('menuView');
        const resultView = document.getElementById('resultView');
        const resultText = document.getElementById('resultText');

        function initButtons() {
            buttonsGrid.innerHTML = '';
            for (let i = 0; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i;
                btn.onclick = () => appendNumber(i);
                buttonsGrid.appendChild(btn);
            }
        }

        // 点击数字追加输入，并重置 3 秒倒计时
        function appendNumber(num) {
            if (!isPlaying) return;
            if (userInput.length < 2) { // 小学题目最大两位数，限制输入2位即可
                userInput += num.toString();
                answerDisplay.innerText = userInput;
                resetAutoSubmitTimer();
            }
        }

        // 退格，并重置倒计时
        function backspace() {
            if (!isPlaying) return;
            userInput = userInput.slice(0, -1);
            answerDisplay.innerText = userInput;
            resetAutoSubmitTimer();
        }

        // 重置自动提交计时器
        function resetAutoSubmitTimer() {
            clearTimeout(autoSubmitTimer);
            
            if (userInput === "") {
                // 如果框里没数字了，取消提示，变回绿色
                answerDisplay.classList.remove('waiting');
                autoHint.classList.remove('show');
                return;
            }

            // 有数字了，变橘色，显示提示，开始 3 秒倒计时
            answerDisplay.classList.add('waiting');
            autoHint.classList.add('show');

            autoSubmitTimer = setTimeout(() => {
                // 3秒到了，执行提交
                submitAnswer();
            }, 3000); 
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function backToMenu() {
            isPlaying = false;
            clearInterval(timerInterval);
            clearTimeout(autoSubmitTimer); // 清理自动提交
            
            overlay.classList.remove('hidden');
            menuView.style.display = 'block';
            resultView.style.display = 'none';
            
            timeDisplay.innerText = "00:00";
            scoreDisplay.innerText = `0/10`;
            
            num1El.innerText = "0";
            num2El.innerText = "0";
            operatorEl.innerText = "+";
            answerDisplay.innerText = "";
            answerDisplay.classList.remove('waiting');
            autoHint.classList.remove('show');
            userInput = "";
        }

        function startGame(mode) {
            currentMode = mode;
            
            menuView.style.display = 'none';
            resultView.style.display = 'none';
            overlay.classList.add('hidden');
            
            isPlaying = true;
            score = 0;
            currentQuestionIndex = 0;
            secondsElapsed = 0;
            updateScore();
            timeDisplay.innerText = "00:00";
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timeDisplay.innerText = formatTime(secondsElapsed);
            }, 1000);

            generateQuestion();
        }

        function generateQuestion() {
            if (currentQuestionIndex >= totalQuestions) {
                endGame();
                return;
            }

            // 重置 UI 状态
            clearTimeout(autoSubmitTimer);
            userInput = "";
            answerDisplay.innerText = "";
            answerDisplay.className = "answer-box"; // 清空颜色状态
            autoHint.classList.remove('show');
            isPlaying = true;

            if (currentMode === 'add10') {
                const isAdd = Math.random() > 0.5;
                if (isAdd) {
                    currentAnswer = Math.floor(Math.random() * 9) + 1;
                    const a = Math.floor(Math.random() * currentAnswer);
                    const b = currentAnswer - a;
                    num1El.innerText = a; operatorEl.innerText = "+"; num2El.innerText = b;
                } else {
                    const a = Math.floor(Math.random() * 10) + 1;
                    const b = Math.floor(Math.random() * (a + 1));
                    currentAnswer = a - b;
                    num1El.innerText = a; operatorEl.innerText = "-"; num2El.innerText = b;
                }
            } 
            else if (currentMode === 'add20') {
                const isAdd = Math.random() > 0.5;
                if (isAdd) {
                    currentAnswer = Math.floor(Math.random() * 19) + 2;
                    const a = Math.floor(Math.random() * currentAnswer);
                    const b = currentAnswer - a;
                    num1El.innerText = a; operatorEl.innerText = "+"; num2El.innerText = b;
                } else {
                    const a = Math.floor(Math.random() * 20) + 1;
                    const b = Math.floor(Math.random() * (a + 1));
                    currentAnswer = a - b;
                    num1El.innerText = a; operatorEl.innerText = "-"; num2El.innerText = b;
                }
            } 
            else if (currentMode === 'mul') {
                const a = Math.floor(Math.random() * 9) + 1;
                const b = Math.floor(Math.random() * 9) + 1;
                currentAnswer = a * b;
                num1El.innerText = a; operatorEl.innerText = "×"; num2El.innerText = b;
            }
        }

        function submitAnswer() {
            // 如果已经提交或没有输入，则不处理
            if (!isPlaying || userInput === "") return;

            clearTimeout(autoSubmitTimer); // 取消自动倒计时
            const answerNum = parseInt(userInput);

            if (answerNum === currentAnswer) {
                isPlaying = false; // 暂停输入
                answerDisplay.classList.remove('waiting');
                autoHint.classList.remove('show');
                answerDisplay.classList.add('correct-anim');
                playSound('correct');
                
                score++;
                updateScore();
                currentQuestionIndex++;

                setTimeout(() => {
                    if (currentQuestionIndex < totalQuestions) {
                        generateQuestion();
                    } else {
                        endGame();
                    }
                }, 800);

            } else {
                isPlaying = false; // 暂时禁用，防止连点
                answerDisplay.classList.remove('waiting');
                autoHint.classList.remove('show');
                answerDisplay.classList.add('wrong-anim');
                playSound('wrong');
                
                // 答错后 0.8 秒重置当前题目，允许重新输入
                setTimeout(() => {
                    userInput = "";
                    answerDisplay.innerText = "";
                    answerDisplay.className = "answer-box";
                    isPlaying = true;
                }, 800);
            }
        }

        function updateScore() {
            scoreDisplay.innerText = `${score}/${totalQuestions}`;
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            clearTimeout(autoSubmitTimer);
            
            overlay.classList.remove('hidden');
            menuView.style.display = 'none';
            resultView.style.display = 'block';
            
            resultText.innerHTML = `你用了 <b>${formatTime(secondsElapsed)}</b>，答对了 <b>${score}</b> 道题！<br>你太棒啦！`;
            
            createConfetti();
            playSound('win');
        }

        function playSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                if (type === 'correct') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.3);
                        osc.start(ctx.currentTime + i * 0.1);
                        osc.stop(ctx.currentTime + i * 0.1 + 0.3);
                    });
                }
            } catch (e) {}
        }

        function createConfetti() {
            const container = document.getElementById('gameContainer');
            const colors = ['#fbbf24', '#ef4444', '#3b82f6', '#22c55e', '#ec4899'];
            for(let i=0; i<40; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = '-10px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDelay = Math.random() * 0.5 + 's';
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                container.appendChild(conf);
                setTimeout(() => { if(conf.parentNode) conf.parentNode.removeChild(conf); }, 2500);
            }
        }

        initButtons();
        updateScore();
    </script>
</body>
</html>
