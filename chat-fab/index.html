<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat FAB — 小宠物</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    background: #ffffff;
    overflow: hidden;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .chat-fab {
    position: fixed;
    width: 46px;
    height: 46px;
    z-index: 26;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .chat-fab:active { cursor: grabbing; }

  .fab-core {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    transition: transform 0.2s ease, background 0.2s;
  }
  .chat-fab:hover .fab-core {
    transform: scale(1.08);
    background: rgba(0, 0, 0, 0.7);
  }
  .chat-fab.active .fab-core {
    background: linear-gradient(135deg, #ff9a5a, #ff7a45);
    border-color: transparent;
  }

  /* 白色脸（矩形+眼睛）上下浮动 */
  .face {
    animation: float 3.2s ease-in-out infinite;
    display: block;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  .dots      { transition: opacity 0.2s; }
  .diamonds  { opacity: 0; transition: opacity 0.2s; }
  .chat-fab.far .dots     { opacity: 0; }
  .chat-fab.far .diamonds { opacity: 1; }

  .diamond {
    transform-box: fill-box;
    transform-origin: center;
  }
  .chat-fab.far .diamond {
    animation: blink 3s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 40%, 60%, 100% { transform: scaleY(1); }
    45%, 55%           { transform: scaleY(0.1); }
  }

  /* ───── 语言气泡 ───── */
  .bubble {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 50%;
    transform: translateX(-50%) scale(0.7) translateY(6px);
    transform-origin: bottom center;
    background: rgba(30, 30, 42, 0.95);
    color: #fff;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    transition:
      opacity 0.22s ease,
      transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
  }
  .bubble::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: rgba(30, 30, 42, 0.95);
  }
  .bubble.show {
    opacity: 1;
    transform: translateX(-50%) scale(1) translateY(0);
  }

  /* 靠近屏幕顶部时，气泡翻转到下方 */
  .bubble.below {
    bottom: auto;
    top: calc(100% + 12px);
    transform-origin: top center;
    transform: translateX(-50%) scale(0.7) translateY(-6px);
  }
  .bubble.below::after {
    top: auto;
    bottom: 100%;
    border-top-color: transparent;
    border-bottom-color: rgba(30, 30, 42, 0.95);
  }
  .bubble.below.show {
    transform: translateX(-50%) scale(1) translateY(0);
  }

  /* 换文案时的小淡入 */
  #bubbleText { display: inline-block; }
  #bubbleText.text-anim { animation: textIn 0.25s ease; }
  @keyframes textIn {
    0%   { opacity: 0; transform: translateY(2px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ───── CSS 爱心 ───── */
  .heart {
    position: fixed;
    background: #ff4d6d;
    transform: rotate(-45deg);
    pointer-events: none;
    z-index: 100;
    animation: heartFloat 1.3s cubic-bezier(0.2, 0.6, 0.3, 1) forwards;
    filter: drop-shadow(0 0 6px rgba(255, 77, 109, 0.55));
  }
  /* 两个圆 + 旋转正方形拼成心形 */
  .heart::before,
  .heart::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: inherit;
    border-radius: 50%;
  }
  .heart::before { top: -50%; left: 0; }
  .heart::after  { top: 0; left: 50%; }

  @keyframes heartFloat {
    0% {
      opacity: 0;
      transform: translate(0, 0) rotate(-45deg) scale(0.3);
    }
    15% {
      opacity: 1;
      transform: translate(calc(var(--dx) * 0.12), calc(var(--dy) * 0.12))
                 rotate(-45deg) scale(1.05);
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx), var(--dy))
                 rotate(calc(-45deg + var(--rot))) scale(0.85);
    }
  }
</style>
</head>
<body>

<div class="chat-fab" id="fab">
  <div class="bubble" id="bubble">
    <span id="bubbleText"></span>
  </div>
  <span class="fab-core">
    <svg class="face" viewBox="0 0 32 24" width="24" height="18">
      <rect x="1" y="1" width="30" height="22" rx="7" fill="#fff" />
      <g id="eyeGroup" transform="translate(0 0)">
        <g class="dots">
          <circle cx="10" cy="12" r="2.6" fill="#1a1a1a" />
          <circle cx="22" cy="12" r="2.6" fill="#1a1a1a" />
        </g>
        <g class="diamonds">
          <g transform="translate(10 12)">
            <path class="diamond" d="M0,-3.2 L3.2,0 L0,3.2 L-3.2,0 Z" fill="#1a1a1a" />
          </g>
          <g transform="translate(22 12)">
            <path class="diamond" d="M0,-3.2 L3.2,0 L0,3.2 L-3.2,0 Z" fill="#1a1a1a" />
          </g>
        </g>
      </g>
    </svg>
  </span>
</div>

<script>
(function () {
  const SIZE = 46;
  const MAX_OFFSET = 2.5;
  const FAR_DIST = 260;
  const CLOSE_DIST = 70;
  const HOLD_MS = 4000;   // 每条文案最少保留 4s
  const FLASH_MS = 1800;  // 点击反馈时长

  const fab = document.getElementById('fab');
  const eyeGroup = document.getElementById('eyeGroup');
  const bubble = document.getElementById('bubble');
  const bubbleText = document.getElementById('bubbleText');

  let pos = {
    x: (window.innerWidth - SIZE) / 2,
    y: (window.innerHeight - SIZE) / 2
  };
  let isFar = false;
  let active = false;

  // ───── 气泡状态 ─────
  let currentZone = 'none';
  let lockUntil = 0;
  let zoneTimer = null;
  let dragOverride = false;
  let flashUntil = 0;
  let flashTimer = null;
  let lastMouse = { x: 0, y: 0 };

  // ───── 文案库 ─────
  const LINES = {
    close: ['嘿嘿～好痒哦', '贴贴～', '摸摸头嘛', '最喜欢你啦！', '一起玩好不好？'],
    near:  ['嗯？在看我吗', '你来啦～', '看到你了哦', '今天也要元气满满', '要聊聊天吗？'],
    drag:  ['哇啊～要飞了', '轻点轻点…', '头晕啦～', '带我去哪儿呀？'],
    click: ['好耶！', '嘿嘿嘿～', '♪ ♪ ♪', '最喜欢你了！', '抱抱～']
  };
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];

  // ───── 爱心特效 ─────
  function spawnHearts(originX, originY, count) {
    for (let i = 0; i < count; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';

      const size = 8 + Math.random() * 8;               // 8~16px
      const dx = (Math.random() - 0.5) * 70;            // 水平漂移
      const dy = -(60 + Math.random() * 80);            // 向上飘
      const rot = (Math.random() - 0.5) * 70;           // 额外旋转
      const dur = 1.1 + Math.random() * 0.5;            // 1.1~1.6s
      const delay = Math.random() * 0.15;

      heart.style.width = size + 'px';
      heart.style.height = size + 'px';
      heart.style.left = (originX - size / 2) + 'px';
      heart.style.top  = (originY - size / 2) + 'px';
      heart.style.setProperty('--dx', dx + 'px');
      heart.style.setProperty('--dy', dy + 'px');
      heart.style.setProperty('--rot', rot + 'deg');
      heart.style.animationDuration = dur + 's';
      heart.style.animationDelay = delay + 's';
      // 每颗心略微不同的红色
      const hue = 340 + Math.random() * 15;
      heart.style.background = `hsl(${hue}, 95%, ${58 + Math.random() * 8}%)`;

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), (dur + delay) * 1000 + 100);
    }
  }

  // ───── 气泡显示 / 隐藏 ─────
  function showBubble() {
    bubble.classList.toggle('below', pos.y < 100);
    bubble.classList.add('show');
  }
  function hideBubble() {
    bubble.classList.remove('show');
  }

  function distFromFab() {
    const rect = fab.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.hypot(lastMouse.x - cx, lastMouse.y - cy);
  }

  function zoneFromDist(d) {
    if (d <= CLOSE_DIST) return 'close';
    if (d <= FAR_DIST)   return 'near';
    return 'none';
  }

  function showLine(zone) {
    const lines = LINES[zone];
    if (!lines) {
      hideBubble();
      currentZone = 'none';
      lockUntil = 0;
      clearTimeout(zoneTimer);
      zoneTimer = null;
      return;
    }
    showBubble();
    bubbleText.classList.remove('text-anim');
    void bubbleText.offsetWidth;
    bubbleText.textContent = pick(lines);
    bubbleText.classList.add('text-anim');

    currentZone = zone;
    lockUntil = Date.now() + HOLD_MS;
    scheduleTick();
  }

  function scheduleTick() {
    clearTimeout(zoneTimer);
    zoneTimer = null;
    if (currentZone === 'none') return;
    const wait = Math.max(20, lockUntil - Date.now());
    zoneTimer = setTimeout(tick, wait);
  }

  function tick() {
    if (Date.now() < flashUntil) return;
    if (dragOverride) { showLine('drag'); return; }

    const target = zoneFromDist(distFromFab());
    if (target === 'none') {
      hideBubble();
      currentZone = 'none';
      lockUntil = 0;
      return;
    }
    showLine(target);
  }

  function flashBubble(text) {
    clearTimeout(zoneTimer);
    clearTimeout(flashTimer);
    showBubble();
    bubbleText.classList.remove('text-anim');
    void bubbleText.offsetWidth;
    bubbleText.textContent = text;
    bubbleText.classList.add('text-anim');

    flashUntil = Date.now() + FLASH_MS;
    flashTimer = setTimeout(() => {
      flashUntil = 0;
      if (dragOverride) { showLine('drag'); return; }
      const target = zoneFromDist(distFromFab());
      if (target === 'none') {
        hideBubble();
        currentZone = 'none';
        lockUntil = 0;
      } else {
        showLine(target);
      }
    }, FLASH_MS);
  }

  // ───── 位置 ─────
  function applyPos() {
    fab.style.left = pos.x + 'px';
    fab.style.top = pos.y + 'px';
    if (bubble.classList.contains('show')) {
      bubble.classList.toggle('below', pos.y < 100);
    }
  }

  // ───── 眼睛跟随 / 档位判定 ─────
  function onLook(e) {
    lastMouse.x = e.clientX;
    lastMouse.y = e.clientY;

    const rect = fab.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const mx = e.clientX - cx;
    const my = e.clientY - cy;
    const d = Math.hypot(mx, my);

    if (d > FAR_DIST) {
      if (!isFar) {
        isFar = true;
        fab.classList.add('far');
        eyeGroup.setAttribute('transform', 'translate(0 0)');
      }
    } else {
      if (isFar) { isFar = false; fab.classList.remove('far'); }
      const angle = Math.atan2(my, mx);
      eyeGroup.setAttribute('transform',
        `translate(${Math.cos(angle) * MAX_OFFSET} ${Math.sin(angle) * MAX_OFFSET})`);
    }

    if (dragOverride) return;
    if (Date.now() < flashUntil) return;
    if (currentZone !== 'none' && Date.now() < lockUntil) return;

    const target = zoneFromDist(d);
    if (target === 'none') {
      if (currentZone !== 'none') {
        hideBubble();
        currentZone = 'none';
        lockUntil = 0;
        clearTimeout(zoneTimer);
        zoneTimer = null;
      }
      return;
    }
    if (target === currentZone) return;
    showLine(target);
  }

  // ───── 拖拽 + 点击 ─────
  function onDrag(e) {
    lastMouse.x = e.clientX;
    lastMouse.y = e.clientY;

    const x0 = e.clientX;
    const y0 = e.clientY;
    const ox = pos.x;
    const oy = pos.y;
    let moved = false;

    function move(ev) {
      const dx = ev.clientX - x0;
      const dy = ev.clientY - y0;
      if (!moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
        moved = true;
        dragOverride = true;
        clearTimeout(flashTimer);
        flashUntil = 0;
        showLine('drag');
      }
      if (moved) {
        pos.x = Math.max(0, Math.min(window.innerWidth - SIZE, ox + dx));
        pos.y = Math.max(0, Math.min(window.innerHeight - SIZE, oy + dy));
        applyPos();
      }
    }

    function up() {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      if (!moved) {
        // ★ 点击：切换 active + 开心反馈 + 冒爱心
        active = !active;
        fab.classList.toggle('active', active);
        flashBubble(pick(LINES.click));

        // 从图标中心冒出爱心
        spawnHearts(pos.x + SIZE / 2, pos.y + SIZE / 2, 6 + ((Math.random() * 3) | 0));
      } else {
        dragOverride = false;
        const target = zoneFromDist(distFromFab());
        if (target === 'none') {
          hideBubble();
          currentZone = 'none';
          lockUntil = 0;
          clearTimeout(zoneTimer);
          zoneTimer = null;
        } else {
          showLine(target);
        }
      }
    }

    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  }

  fab.addEventListener('mousedown', onDrag);
  window.addEventListener('mousemove', onLook);
  window.addEventListener('resize', () => {
    pos.x = Math.min(pos.x, window.innerWidth - SIZE);
    pos.y = Math.min(pos.y, window.innerHeight - SIZE);
    applyPos();
  });

  applyPos();
})();
</script>
</body>
</html>
