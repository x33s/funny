<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧸 幼儿启蒙小乐园</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-sub: #6b7280;
      --accent: #ff7a45;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* 顶部背景装饰 */
    .hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 300px;
      background: linear-gradient(135deg, rgba(255,154,90,0.1), rgba(255,122,69,0.05));
      z-index: -1;
      clip-path: polygon(0 0, 100% 0, 100% 60%, 0 100%);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 64px;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ff9a5a, #ff7a45);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    p.subtitle {
      font-size: 16px;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .links a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      background: var(--card-bg);
      border-radius: 100px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .links a:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
      color: var(--accent);
    }

    /* 卡片网格：小尺寸紧凑卡片 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
      border: 1px solid rgba(0,0,0,0.04);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .card-icon {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: linear-gradient(135deg, rgba(255,154,90,0.18), rgba(255,122,69,0.12));
    }

    .card-text {
      min-width: 0;
    }

    .card h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card p {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 空状态提示 */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      border: 2px dashed #e5e7eb;
      border-radius: var(--radius);
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="hero-bg"></div>

  <div class="container">
    <header>
      <h1>🧸 幼儿启蒙小乐园</h1>
      <p class="subtitle">陪孩子一起点一点、认一认、读一读。</p>
      <div class="links">
        <a href="https://github.com/x33s/funny" target="_blank">⭐ GitHub</a>
        <a href="https://github.com/x33s/funny/issues" target="_blank">🐛 Issue</a>
      </div>
    </header>

    <main class="grid">
      <!-- 卡片 1 -->
      <a class="card" href="./chat-fab/">
        <div class="card-icon">🐱</div>
        <div class="card-text">
          <h3>Chat FAB</h3>
          <p>毛玻璃悬浮球 · 眼睛跟随鼠标</p>
        </div>
      </a>

      <!-- 卡片 2 -->
      <a class="card" href="./交通工具拼音识字乐园/">
        <div class="card-icon">🚌</div>
        <div class="card-text">
          <h3>交通工具拼音识字乐园</h3>
          <p>看图识车 · 拼音认读</p>
        </div>
      </a>


       <a class="card" href="./math/">
        <div class="card-icon">数</div>
        <div class="card-text">
          <h3>数学</h3>
          <p>数学算术</p>
        </div>
      </a>

      <a class="card" href="./poem/">
        <div class="card-icon">古</div>
        <div class="card-text">
          <h3>古诗</h3>
          <p>古诗 读</p>
        </div>
      </a>

      <!-- 如果有新页面，复制上面的 <a> 标签，修改 href、图标、标题和描述即可 -->

      <!-- 暂时注释掉的空状态，后续加卡片可以删掉这段 -->
      <!-- 
      <div class="empty-state">
        更多有趣的微交互正在复刻中...
      </div> 
      -->
    </main>
  </div>

</body>
</html>
